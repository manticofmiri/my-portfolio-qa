<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miriam Costa Manticof - Home</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/general.css">

</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">Miriam Costa Manticof</div>
            <ul class="nav-links">
                <li><a href="index.html">🏠 Home</a></li>
                <li><a href="cv.html">📄 CV</a></li>
                <li><a href="project.html">🚀 Projects</a></li>
                <li><a href="qa.html">🧪 QA</a></li>
            </ul>
        </div>
    </nav>
    <section class="hero">
        <div class="hero-inner">
            <h1>¡Hi! I'm <span class="hero-name">Miriam Costa Manticof</span></h1>
            <p class="subtitle typewriter-block" aria-live="polite">
                <span id="typewriter-out"></span><span class="typewriter-cursor" aria-hidden="true">▍</span>
            </p>
            <div class="cta-buttons">
                <a href="cv.html" class="btn btn-primary">📄 My CV</a>
                <a href="project.html" class="btn btn-secondary">🚀 My Projects</a>
            </div>
        </div>
    </section>
    <script>
        (function () {
            var full = "Open to new opportunities · Trilingual QA engineer.";
            var out = document.getElementById("typewriter-out");
            var cta = document.querySelector(".hero .cta-buttons");
            var cursor = document.querySelector(".typewriter-cursor");
            if (!out) return;
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                out.textContent = full;
                if (cursor) cursor.classList.add("is-hidden");
                if (cta) cta.classList.add("is-visible");
                return;
            }
            var i = 0;
            var ms = 48;
            function tick() {
                if (i < full.length) {
                    out.textContent += full.charAt(i);
                    i++;
                    setTimeout(tick, ms);
                } else if (cta) {
                    cta.classList.add("is-visible");
                }
            }
            setTimeout(tick, 450);
        })();
    </script>
</body>
</html>
